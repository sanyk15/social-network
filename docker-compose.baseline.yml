# Single-node baseline for the "before replication" read measurements.
#
#   docker compose -f docker-compose.baseline.yml up -d --build
#   docker compose -f docker-compose.baseline.yml --profile seed run --rm seed
#
# The application sees no replicas and therefore reads from the only database.
name: social-baseline

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - social_baseline_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: app
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://social:social@db:5432/social?sslmode=disable"
      DATABASE_REPLICA_URLS: ""
      DB_MAX_CONNS: "${DB_MAX_CONNS:-16}"
      LOG_REQUESTS: "false"
      ENABLE_TEST_API: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  seed:
    build:
      context: .
      target: seed
    profiles: ["seed"]
    environment:
      DATABASE_URL: "postgres://social:social@db:5432/social?sslmode=disable"
      DB_MAX_CONNS: "8"
    volumes:
      - "${SEED_CSV:-../people.v2.csv}:/data/people.v2.csv:ro"
    command: ["-csv", "/data/people.v2.csv", "-n", "${SEED_N:-1000000}", "-truncate"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  social_baseline_data:
