# Replication lab: one primary and two physical streaming replicas.
#
#   docker compose up -d --build
#   docker compose --profile seed run --rm seed
#
# The application routes reads to the replicas and writes to pg-master.
name: social-replication

x-postgres-env: &postgres-env
  POSTGRES_USER: social
  POSTGRES_PASSWORD: social
  POSTGRES_DB: social

services:
  pg-master:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replpass
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=1GB
      - -c
      - hot_standby=on
      - -c
      - synchronous_commit=on
      - -c
      - listen_addresses=*
    volumes:
      - pg_master_data:/var/lib/postgresql/data
      - ./deploy/postgres/master-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-slave-1:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      MASTER_HOST: pg-master
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replpass
      REPLICA_NAME: pg-slave-1
    entrypoint: ["/bin/bash", "/scripts/slave-entrypoint.sh"]
    volumes:
      - pg_slave_1_data:/var/lib/postgresql/data
      - ./deploy/postgres/slave-entrypoint.sh:/scripts/slave-entrypoint.sh:ro
    ports:
      - "5433:5432"
    depends_on:
      pg-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 30

  pg-slave-2:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      MASTER_HOST: pg-master
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replpass
      REPLICA_NAME: pg-slave-2
    entrypoint: ["/bin/bash", "/scripts/slave-entrypoint.sh"]
    volumes:
      - pg_slave_2_data:/var/lib/postgresql/data
      - ./deploy/postgres/slave-entrypoint.sh:/scripts/slave-entrypoint.sh:ro
    ports:
      - "5434:5432"
    depends_on:
      pg-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # The feed cache is rebuildable from PostgreSQL, so Redis persistence is
    # intentionally disabled: a restart is just a cold cache.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: app
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL:-postgres://social:social@pg-master:5432/social?sslmode=disable}"
      DATABASE_REPLICA_URLS: "${DATABASE_REPLICA_URLS:-postgres://social:social@pg-slave-1:5432/social?sslmode=disable,postgres://social:social@pg-slave-2:5432/social?sslmode=disable}"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-16}"
      LOG_REQUESTS: "false"
      ENABLE_TEST_API: "true"
      READ_FALLBACK_TO_MASTER: "true"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      FEED_SIZE: "${FEED_SIZE:-1000}"
      FEED_CACHE_TTL: "${FEED_CACHE_TTL:-10m}"
      POST_CACHE_TTL: "${POST_CACHE_TTL:-1h}"
      FEED_INCLUDE_OWN: "${FEED_INCLUDE_OWN:-true}"
      FEED_FANOUT_MODE: "${FEED_FANOUT_MODE:-sync}"
      FEED_WORKERS: "${FEED_WORKERS:-2}"
    ports:
      - "8080:8080"
    depends_on:
      pg-master:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  seed:
    build:
      context: .
      target: seed
    profiles: ["seed"]
    environment:
      DATABASE_URL: "postgres://social:social@pg-master:5432/social?sslmode=disable"
      DB_MAX_CONNS: "8"
    volumes:
      - "${SEED_CSV:-../people.v2.csv}:/data/people.v2.csv:ro"
    command: ["-csv", "/data/people.v2.csv", "-n", "${SEED_N:-1000000}", "-truncate"]
    depends_on:
      pg-master:
        condition: service_healthy

  # Дружба и посты для первых N пользователей. По умолчанию тексты генерируются;
  # чтобы взять файл курса, смонтируйте его и передайте -posts-file:
  #
  #   docker compose --profile seed run --rm -v "$PWD/../posts.txt:/data/posts.txt:ro" \
  #     seedfeed -posts-file /data/posts.txt
  seedfeed:
    build:
      context: .
      target: seedfeed
    profiles: ["seed"]
    environment:
      DATABASE_URL: "postgres://social:social@pg-master:5432/social?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      DB_MAX_CONNS: "8"
    command:
      - "-users"
      - "${SEED_FEED_USERS:-1000}"
      - "-friends"
      - "${SEED_FEED_FRIENDS:-20}"
      - "-posts"
      - "${SEED_FEED_POSTS:-100000}"
      - "-truncate"
    depends_on:
      pg-master:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Перестройка кэшей лент из СУБД:
  #   docker compose --profile admin run --rm feedrebuild -user-id 42
  #   docker compose --profile admin run --rm feedrebuild -all
  feedrebuild:
    build:
      context: .
      target: feedrebuild
    profiles: ["admin"]
    environment:
      DATABASE_URL: "postgres://social:social@pg-master:5432/social?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      DB_MAX_CONNS: "4"
    command: ["-all"]
    depends_on:
      pg-master:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_master_data:
  pg_slave_1_data:
  pg_slave_2_data:
